[package]
name = "abdocode-desktop"
version = "4.0.66"
edition = "2021"
description = "عبدو كود — واجهة سطح المكتب فوق نواة Rust"

# مستقلّ عن أي workspace أبويّ — نواة packages/kernel لها فضاؤها
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
portable-pty = { version = "0.9.0", default-features = false }
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37.5"
calamine = "0.36.1"
pdf-extract = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
