[workspace]
members = [
  "crates/abdo-contracts",
  "crates/abdo-journal",
  "crates/abdo-kernel",
  "crates/abdo-authority",
  "crates/abdo-policy",
  "crates/abdo-evidence",
  "crates/abdo-tools",
  "crates/abdo-runtime",
  "bins/abdo-kernel",
  "bins/abdo-tool-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
