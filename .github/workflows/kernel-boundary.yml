name: kernel-boundary

on:
  # The boundary guard scans the whole repository, so a path filter would let a
  # new consumer or dependency slip past it from an unrelated package. The guard
  # itself refuses this workflow if a filter appears here.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-boundaries:
    name: S104 contracts, S105 journal, and bootstrap boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Reproduce the Bun dependency graph
        run: bun install --frozen-lockfile
      - name: Enforce the offline S104 contract and S105 journal gates
        run: |
          bun run --cwd packages/kernel test
          bun run --cwd packages/kernel typecheck
      - name: Verify product composition
        run: |
          bun run structure
          bun run test:root
      - name: Typecheck every package
        run: bun run typecheck
