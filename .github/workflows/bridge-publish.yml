name: bridge-publish

# Publishes an update of the Abdo Code Bridge browser extension to Chrome Web Store,
# Microsoft Edge Add-ons and Firefox Add-ons (AMO). Release: bump
# packages/browser-bridge/extension/manifest.json, then push the tag bridge-vX.Y.Z.
# A store whose secrets are absent is reported "skipped: missing <VAR>", never as success.
on:
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch:
    inputs:
      stores:
        description: "Comma-separated stores: chrome,edge,firefox"
        required: false
        default: "chrome,edge,firefox"
        type: string
      dry_run:
        description: "Print the requests without calling the stores"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bridge-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: The tag version equals the manifest version
        run: |
          node --version
          manifest_version=$(node -p "require('./packages/browser-bridge/extension/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#bridge-v}"
            if [ "$tag_version" != "$manifest_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME is $tag_version but extension/manifest.json is $manifest_version"
              exit 1
            fi
          fi
          echo "BRIDGE_VERSION=$manifest_version" >> "$GITHUB_ENV"
      - name: Store packages and the publisher pass their tests
        working-directory: packages/engine
        run: bun test test/browser-extension-pack.test.ts test/bridge-publish.test.ts
      - name: Publish
        working-directory: packages/browser-bridge
        env:
          STORES: ${{ inputs.stores || 'chrome,edge,firefox' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/publish.mjs --stores "$STORES" --expect-version "$BRIDGE_VERSION" $DRY_RUN
